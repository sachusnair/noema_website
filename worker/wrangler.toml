name = "noema-chat"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origins allowed to call this endpoint. The browser refuses the response for
# anything not on this list. Keep localhost here only while developing.
ALLOWED_ORIGINS = "https://noemabrain.com,https://www.noemabrain.com,http://localhost:3000"

# The Anthropic key is NOT here. Set it as a secret, which never lands in the
# repo or in the deployed bundle:
#
#   wrangler secret put ANTHROPIC_API_KEY
#
# Optional per-IP rate limiting: create a KV namespace and uncomment the block
# below. Without it the Worker still runs, with no per-IP cap.
#
#   wrangler kv namespace create RATE_LIMIT
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<the id wrangler prints>"
